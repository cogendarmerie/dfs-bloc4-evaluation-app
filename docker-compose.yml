services:

  # =========================
  # Laravel / PHP
  # =========================
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: opstrack-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - opstrack

  # =========================
  # Nginx
  # =========================
  nginx:
    image: nginx:1.27-alpine
    container_name: opstrack-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - opstrack

  # =========================
  # MySQL
  # =========================
  mysql:
    image: mysql:8.4
    container_name: opstrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: opstrack
      MYSQL_USER: user1
      MYSQL_PASSWORD: 0000
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - opstrack

  # =========================
  # MongoDB
  # =========================
  mongodb:
    image: mongo:8
    container_name: opstrack-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: opstrack_logs
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - opstrack

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7-alpine
    container_name: opstrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - opstrack

  # =========================
  # Next.js
  # =========================
  dispatch-dashboard:
    build:
      context: ./microservices/dispatch-dashboard
      dockerfile: Dockerfile
    container_name: opstrack-dispatch-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      OPSTRACK_API_URL: http://nginx/api
      OPSTRACK_API_TOKEN: ${OPSTRACK_API_TOKEN}
    volumes:
      - ./microservices/dispatch-dashboard:/app
      - dispatch_node_modules:/app/node_modules
      - dispatch_next:/app/.next
    depends_on:
      - nginx
    networks:
      - opstrack

networks:
  opstrack:
    driver: bridge

volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  dispatch_node_modules:
  dispatch_next: