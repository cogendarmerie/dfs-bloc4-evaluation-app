name: Deploiement OpsTrack

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  tests:
    name: Tests et controles
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, pdo_mysql
          tools: composer

      - name: Installer les dependances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configurer Laravel pour les tests
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verifier la syntaxe du webhook
        run: php -l public/hooks.php

      - name: Executer les tests Laravel
        run: php artisan test

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dependances JavaScript
        run: npm install

      - name: Construire le frontend
        run: npm run build


  qualification:
    name: Deploiement qualification
    needs: tests
    runs-on: ubuntu-latest

    steps:

      - name: Deployer en qualification
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.QUALIF_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html

            echo "======================================"
            echo " Deploiement en qualification"
            echo "======================================"

            echo "Recuperation du code"
            git fetch origin main
            git reset --hard origin/main

            echo "Installation des dependances PHP"
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            echo "Migration de la base de donnees"
            php artisan migrate --force

            echo "Nettoyage du cache Laravel"
            php artisan optimize:clear

            echo "Reconstruction du cache Laravel"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Installation des dependances JavaScript"
            npm install

            echo "Compilation du frontend"
            npm run build

            echo "Rechargement du serveur web"
            sudo systemctl reload apache2

            echo "======================================"
            echo " Qualification terminee"
            echo "======================================"

      - name: Smoke test qualification
        run: |
          STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" \
            https://eval-dfs-q-tpl-20265-08.it-students.fr)

          echo "Code HTTP qualification : $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Le smoke test qualification a echoue"
            exit 1
          fi

          echo "Smoke test qualification OK"


  production:
    name: Deploiement production
    needs: qualification
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Deployer en production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html

            echo "======================================"
            echo " Deploiement en production"
            echo "======================================"

            echo "Commit actuellement en production"
            git rev-parse HEAD

            echo "Recuperation du code"
            git fetch origin main
            git reset --hard origin/main

            echo "Installation des dependances PHP"
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            echo "Migration de la base de donnees"
            php artisan migrate --force

            echo "Nettoyage du cache Laravel"
            php artisan optimize:clear

            echo "Reconstruction du cache Laravel"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Installation des dependances JavaScript"
            npm install

            echo "Compilation du frontend"
            npm run build

            echo "Rechargement du serveur web"
            sudo systemctl reload apache2

            echo "Commit actuellement deploye"
            git rev-parse HEAD

            echo "======================================"
            echo " Production terminee"
            echo "======================================"

      - name: Smoke test production
        run: |
          STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" \
            https://eval-dfs-p-tpl-20265-08.it-students.fr)

          echo "Code HTTP production : $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Le smoke test production a echoue"
            exit 1
          fi

          echo "Smoke test production OK"
